name: Studio UI (Vue and Bun)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck, refusal tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false
      - name: Install pinned Bun (no extra GitHub Action)
        run: |
          npm install --global bun@1.4.4
          bun --version
      - name: Install dependencies
        working-directory: apps/studio
        run: bun install --frozen-lockfile
      - name: Check Studio trust boundary
        working-directory: apps/studio
        run: bun test
      - name: Typecheck and build UI
        working-directory: apps/studio
        run: bun run build
