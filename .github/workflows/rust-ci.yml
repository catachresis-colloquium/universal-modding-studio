# SPDX-FileCopyrightText: 2025-2026 Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>
#
# Rust build + test gate for UMS profiles, edit and package contracts.
#
# Standalone workflow, matching zig-ci / idris-ci / config-gen / licence-hygiene.
#
# Every step here can fail, and each was negative-tested locally before landing:
#
#   fmt/clippy  clippy runs with -D warnings, so a lint is a failure not advice
#   test        the edit, package and profile behavioral contracts
#   replay      the shipped sample edit-script; a rejected script exits non-zero
#   reflect     the compiled registry must equal the Nickel source that
#               generated it — otherwise `describe` could drift into a
#               flattering fiction about what the engine actually does
#   refusal     a NEGATIVE test: an out-of-vocabulary rank must be REFUSED.
#               Without it, an engine that accepted everything would pass
#               every other step in this file.

name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'profiles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'config/**'
      - 'dlc/**'
      - 'schemas/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'profiles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'config/**'
      - 'dlc/**'
      - 'schemas/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: profile SDK, edit engine and package bridge pass their contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      # The profile compiler reads the game's versioned contract as data, by
      # path -- it is not a Cargo dependency, and must never become one
      # (ADR-0016). The contract therefore has to exist for the compiler test
      # to run. Locally the game is at ../IDApTIK; actions/checkout cannot
      # write above the workspace, so CI places it in a subdirectory and points
      # IDAPTIK_ROOT at it.
      #
      # This is a read-only checkout of published contract files. It does not
      # make UMS depend on the game at build time.
      - name: Checkout the sibling game contract (IDApTIK)
        uses: actions/checkout@v4.1.1
        with:
          repository: metadatastician/IDApTIK
          path: .sibling/IDApTIK
          persist-credentials: false

      # rust-toolchain.toml pins the channel and components; rustup honours it
      # automatically, so the version is declared in one place.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (warnings are failures)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test suite
        env:
          IDAPTIK_ROOT: ${{ github.workspace }}/.sibling/IDApTIK
        run: cargo test --workspace

      - name: Replay the shipped sample edit script
        run: cargo run -q -p ums-ai-edit -- check dlc/examples/ai-edit-sample/edit-script.json

      # ADR-0014: a profile's round trip is tested only when an authored
      # fixture is validated, compiled, loaded by the REAL game loader and
      # compared. Until this step existed the round trip was demonstrated
      # locally and defended by nothing.
      #
      # Mirrors `just roundtrip-idaptik` exactly; run as raw cargo so CI does
      # not have to install just. The second command builds the game's own
      # crate from the sibling checkout -- that is the point, it is the
      # production loader and not a reimplementation.
      - name: UMS to IDApTIK round trip through the real game loader
        env:
          IDAPTIK_ROOT: ${{ github.workspace }}/.sibling/IDApTIK
        run: |
          set -euo pipefail
          artifact="$(mktemp --suffix=.idaptik-package.json)"
          repeat="$(mktemp --suffix=.idaptik-package.json)"
          result="$(mktemp --suffix=.idaptik-result.json)"
          trap 'rm -f "$artifact" "$repeat" "$result"' EXIT
          cargo run -q -p ums-profile-sdk --bin ums-profile -- compile-idaptik \
            --source profiles/idaptik/v1/ghost-lobby.ums.json \
            --idaptik-root "$IDAPTIK_ROOT" \
            --output "$artifact"
          # ADR-0014's deterministic-repeat-output clause.
          cargo run -q -p ums-profile-sdk --bin ums-profile -- compile-idaptik \
            --source profiles/idaptik/v1/ghost-lobby.ums.json \
            --idaptik-root "$IDAPTIK_ROOT" \
            --output "$repeat"
          cmp -s "$artifact" "$repeat" || {
            echo "::error::compiler is not deterministic; repeated compiles differ"
            exit 1
          }
          cargo run -q --manifest-path "$IDAPTIK_ROOT/Cargo.toml" \
            -p idaptik-core --example package-runner -- "$artifact" > "$result"
          jq -e '
            .package_format == "idaptik-package/v1"
            and .scenario_id == "envelope-001-ghost-lobby"
            and .seed == 31029276
            and .replay_equal == true
            and .package_guarantees_met == true
            and .snapshot.format == "idaptik-ghost-lobby-runtime-v3"
            and ([.events[].event] | index("CameraPinged") != null)
            and ([.cognitive_trace[].stage] | unique | length == 6)
          ' "$result" >/dev/null
          # ADR-0014's remaining clause: compare against the post-edit model.
          ./scripts/compare-authored-vs-accepted.sh \
            profiles/idaptik/v1/ghost-lobby.ums.json "$result"
          echo "roundtrip-idaptik: UMS artifact accepted, executed, snapshotted, restored and replayed identically"

      # Supersedes the former puzzle-data.yml, which ran `json.load` over one
      # directory. This validates EVERY artifact against the full bridge
      # contracts — manifest envelopes, puzzle payloads, vault sequences, edit
      # scripts and the taxonomy map — including the cross-field invariants
      # JSON Schema cannot express. READINESS.md recorded "full schema
      # validation is local-only" as debt against the DLC bridge; this closes it.
      - name: DLC artifacts satisfy the bridge contracts
        run: cargo run -q -p ums-dlc

      - name: Refusal is real (negative test)
        run: |
          set -euo pipefail
          cat > /tmp/state.json <<'JSON'
          {"zones":[{"id":"lobby","securityTier":0,"worldXStart":0,"worldXEnd":40}],
           "devices":[],"guards":[],"dogs":[],"drones":[],"assassins":[],"items":[],
           "npcs":[],"characters":[],"wiring":[],"zoneTransitions":[],"deviceDefences":[],
           "mission":null,"physical":null,"hasPBX":false,"pbxIp":null,"pbxWorldX":null}
          JSON
          cat > /tmp/bad.json <<'JSON'
          {"edits":[{"verb":"add_guard","id":"g","rank":"Wizard","zone":"lobby"}]}
          JSON
          if cargo run -q -p ums-ai-edit -- check /tmp/bad.json --state /tmp/state.json; then
            echo "::error::an out-of-vocabulary GuardRank was ACCEPTED; the closed world is not closed"
            exit 1
          fi
          echo "out-of-vocabulary rank correctly refused"

      - name: Install nickel and jq (for the reflection identity)
        run: |
          set -euo pipefail
          # /usr/local/bin is root-owned on GitHub-hosted runners, so a bare
          # `curl -o` there fails with permission denied. Stage then install.
          curl -fsSL https://github.com/tweag/nickel/releases/download/1.17.0/nickel-x86_64-linux \
            -o nickel
          sudo install -m 0755 nickel /usr/local/bin/nickel
          rm -f nickel
          nickel --version
          command -v jq >/dev/null || sudo apt-get install -y jq

      - name: Reflection identity — compiled registry equals its Nickel source
        run: |
          set -euo pipefail
          cargo run -q -p ums-ai-edit -- describe > /tmp/described.json
          nickel export config/verbs.ncl --format json > /tmp/source.json
          rc=0
          for field in names arg_order domains; do
            if diff -u <(jq -S ".$field" /tmp/source.json) <(jq -S ".$field" /tmp/described.json); then
              echo "match  $field"
            else
              echo "::error::reflected $field differs from config/verbs.ncl"
              rc=1
            fi
          done
          exit $rc
